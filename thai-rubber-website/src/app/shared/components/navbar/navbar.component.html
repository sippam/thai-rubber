<div
  class="w-full bg-[#06693A] text-white py-4 flex justify-between items-center px-8 relative"
>
  <!-- โลโก้ -->
  <div class="text-lg font-bold">RD Snap</div>
  @if (userProfile) {
  <!-- โปรไฟล์ -->
  <div class="relative">
    <div (click)="toggleMenu()">
      <p class="font-semibold">{{ userProfile.name }}</p>
    </div>
    <!-- เมนู Dropdown -->
    @if (isMenuOpen) {
    <div
      class="absolute right-0 mt-2 w-48 bg-white text-black rounded-lg shadow-lg z-50"
    >
      <!-- Header -->
      <div class="flex items-center p-4 border-b">
        <div>
          <p>ชื่อ: <span class="font-semibold">{{ userProfile.name }}</span></p>
          <p>เบอร์โทรศัพท์: <span class="font-semibold">{{ userProfile.tel }}</span></p>
          <p>ตำแหน่ง: <span class="font-semibold">{{ userProfile.position }}</span></p>
        </div>
      </div>

      <!-- ปุ่ม Logout -->
      <div class="p-4">
        <button mat-flat-button color="warn" (click)="logout()">
          ออกจากระบบ
        </button>
      </div>
    </div>
    }
  </div>
  }
</div>
